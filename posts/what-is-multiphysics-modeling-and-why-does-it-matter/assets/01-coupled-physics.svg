<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Multiphysics modeling: a conceptual reacting-flow system</title>
  <desc id="desc">Fluid flow transports heat and species. Temperature affects density, viscosity, and reaction rates. Reactions can exchange energy with the thermal model.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b5fd0"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0e7e83"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a26913"/></marker>
  </defs>
  <rect width="1440" height="860" fill="#f7f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="720" y="62" text-anchor="middle" fill="#53667e" font-size="16" font-weight="700" letter-spacing="3">PHYSICS CONNECTS THE SYSTEM</text>
    <text x="720" y="128" text-anchor="middle" fill="#17263b" font-size="52" font-weight="700">Multiphysics modeling</text>
    <text x="720" y="176" text-anchor="middle" fill="#53667e" font-size="24">A conceptual reacting-flow system</text>

    <rect x="80" y="270" width="400" height="200" rx="20" fill="#edf3ff" stroke="#2b5fd0" stroke-width="2"/>
    <text x="114" y="320" fill="#2b5fd0" font-size="16" font-weight="700" letter-spacing="2">MOMENTUM</text>
    <text x="114" y="367" fill="#17263b" font-size="34" font-weight="700">Fluid flow</text>
    <text x="114" y="414" fill="#53667e" font-size="24">Velocity and pressure</text>

    <rect x="960" y="270" width="400" height="200" rx="20" fill="#fff6e7" stroke="#a26913" stroke-width="2"/>
    <text x="994" y="320" fill="#a26913" font-size="16" font-weight="700" letter-spacing="2">ENERGY</text>
    <text x="994" y="367" fill="#17263b" font-size="34" font-weight="700">Heat transfer</text>
    <text x="994" y="414" fill="#53667e" font-size="24">Temperature</text>

    <rect x="480" y="580" width="480" height="200" rx="20" fill="#eaf7f6" stroke="#0e7e83" stroke-width="2"/>
    <text x="514" y="630" fill="#0e7e83" font-size="16" font-weight="700" letter-spacing="2">SPECIES BALANCES</text>
    <text x="514" y="677" fill="#17263b" font-size="31" font-weight="700">Transport and reactions</text>
    <text x="514" y="724" fill="#53667e" font-size="24">Composition and reaction rates</text>

    <path d="M496 336H942" fill="none" stroke="#2b5fd0" stroke-width="3" marker-end="url(#blue)"/>
    <text x="720" y="310" text-anchor="middle" fill="#2b5fd0" font-size="22">Heat advection</text>
    <path d="M944 408H498" fill="none" stroke="#a26913" stroke-width="3" marker-end="url(#gold)"/>
    <text x="720" y="382" text-anchor="middle" fill="#a26913" font-size="22">Density and viscosity</text>

    <path d="M280 487V679H461" fill="none" stroke="#0e7e83" stroke-width="3" marker-end="url(#teal)"/>
    <text x="260" y="557" text-anchor="end" fill="#0e7e83" font-size="22">Species</text>
    <text x="260" y="588" text-anchor="end" fill="#0e7e83" font-size="22">advection</text>

    <path d="M1160 488V679H979" fill="none" stroke="#a26913" stroke-width="3" marker-start="url(#gold)" marker-end="url(#gold)"/>
    <text x="1180" y="534" fill="#a26913" font-size="20">Temperature</text>
    <text x="1180" y="563" fill="#a26913" font-size="20">and reaction rates;</text>
    <text x="1180" y="605" fill="#a26913" font-size="20">reaction energy</text>
    <text x="1180" y="634" fill="#a26913" font-size="20">exchange</text>

    <text x="720" y="830" text-anchor="middle" fill="#69798d" font-size="17">Selected physical dependencies. This is a conceptual illustration, not a simulation result.</text>
  </g>
</svg>
