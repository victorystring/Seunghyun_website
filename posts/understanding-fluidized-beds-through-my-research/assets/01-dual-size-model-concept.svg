<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370" role="img" aria-labelledby="title desc"><title id="title">Single-size and dual-size Eulerian models</title><desc id="desc">A single-size model contains one gas and one solid continuum. The dual-size model contains one gas, fine solids S1, and coarse solids S2, with momentum exchange between the phases.</desc><defs><marker id="a183248" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#183248"/></marker><marker id="a4E6578" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4E6578"/></marker><marker id="a156BC0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#156BC0"/></marker><marker id="aAC5D11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#AC5D11"/></marker><marker id="a087A72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#087A72"/></marker><marker id="aD7E2EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D7E2EB"/></marker></defs><rect width="1000" height="1370" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><text x="50" y="65" font-size="41" fill="#183248" font-weight="700" text-anchor="start">One size or two solid populations?</text><text x="50" y="117" font-size="29" fill="#4E6578" font-weight="400" text-anchor="start">A conceptual comparison of Eulerian models</text><rect x="50" y="170" width="900" height="355" rx="20" fill="#F7FAFC" stroke="#D7E2EB" stroke-width="2"/><text x="85" y="227" font-size="31" fill="#183248" font-weight="700" text-anchor="start">SINGLE-SIZE MODEL</text><rect x="85" y="275" width="360" height="140" rx="20" fill="#EDF5FF" stroke="#156BC0" stroke-width="2"/><text x="265" y="335" font-size="32" fill="#156BC0" font-weight="700" text-anchor="middle">Gas continuum</text><text x="265" y="382" font-size="27" fill="#4E6578" font-weight="400" text-anchor="middle">Nitrogen</text><rect x="555" y="275" width="360" height="140" rx="20" fill="#FFF5E9" stroke="#AC5D11" stroke-width="2"/><text x="735" y="329" font-size="29" fill="#AC5D11" font-weight="700" text-anchor="middle">One solid population</text><text x="735" y="379" font-size="34" fill="#AC5D11" font-weight="600" text-anchor="middle">2.45 mm</text><path d="M 465 320 H 535" fill="none" stroke="#156BC0" stroke-width="4" marker-end="url(#a156BC0)"/><path d="M 535 365 H 465" fill="none" stroke="#AC5D11" stroke-width="4" marker-end="url(#aAC5D11)"/><text x="85" y="483" font-size="28" fill="#4E6578" font-weight="400" text-anchor="start">One solid size gives one solid velocity field.</text><rect x="50" y="600" width="900" height="680" rx="20" fill="#F7FAFC" stroke="#D7E2EB" stroke-width="2"/><text x="85" y="657" font-size="31" fill="#183248" font-weight="700" text-anchor="start">DUAL-SIZE EULERIAN MODEL</text><rect x="85" y="710" width="830" height="125" rx="20" fill="#EDF5FF" stroke="#156BC0" stroke-width="2"/><text x="500" y="761" font-size="33" fill="#156BC0" font-weight="700" text-anchor="middle">Gas continuum</text><text x="500" y="808" font-size="27" fill="#4E6578" font-weight="400" text-anchor="middle">Nitrogen</text><path d="M 275 849 V 930" fill="none" stroke="#156BC0" stroke-width="4" marker-end="url(#a156BC0)"/><path d="M 725 849 V 930" fill="none" stroke="#156BC0" stroke-width="4" marker-end="url(#a156BC0)"/><text x="500" y="891" font-size="27" fill="#156BC0" font-weight="600" text-anchor="middle">Gas-solid drag</text><rect x="85" y="950" width="385" height="165" rx="20" fill="#EAF8F5" stroke="#087A72" stroke-width="2"/><text x="277.5" y="999" font-size="30" fill="#087A72" font-weight="700" text-anchor="middle">Fine particles • S1</text><text x="277.5" y="1044" font-size="34" fill="#087A72" font-weight="600" text-anchor="middle">0.278 mm</text><text x="277.5" y="1088" font-size="25" fill="#4E6578" font-weight="400" text-anchor="middle">Volume fraction + velocity</text><rect x="530" y="950" width="385" height="165" rx="20" fill="#FFF5E9" stroke="#AC5D11" stroke-width="2"/><text x="722.5" y="999" font-size="30" fill="#AC5D11" font-weight="700" text-anchor="middle">Coarse particles • S2</text><text x="722.5" y="1044" font-size="34" fill="#AC5D11" font-weight="600" text-anchor="middle">2.324 mm</text><text x="722.5" y="1088" font-size="25" fill="#4E6578" font-weight="400" text-anchor="middle">Volume fraction + velocity</text><path d="M 285 1150 H 715" fill="none" stroke="#087A72" stroke-width="4" marker-end="url(#a087A72)"/><path d="M 715 1195 H 285" fill="none" stroke="#AC5D11" stroke-width="4" marker-end="url(#aAC5D11)"/><text x="500" y="1250" font-size="28" fill="#4E6578" font-weight="600" text-anchor="middle">Solid-solid momentum exchange</text><text x="50" y="1338" font-size="25" fill="#4E6578" font-weight="400" text-anchor="start">Conceptual fields • Diameters from the paper • Not drawn to scale</text></g></svg>