<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Pressure-based approximation for solid holdup</title><desc id="desc">Average solid volume fraction is approximately pressure difference divided by gravitational acceleration times the solid-gas density difference times the vertical interval length.</desc><defs><marker id="a183248" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#183248"/></marker><marker id="a4E6578" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4E6578"/></marker><marker id="a156BC0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#156BC0"/></marker><marker id="aAC5D11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#AC5D11"/></marker><marker id="a087A72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#087A72"/></marker><marker id="aD7E2EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D7E2EB"/></marker></defs><rect width="1000" height="530" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><text x="50" y="65" font-size="38" fill="#183248" font-weight="700" text-anchor="start">Pressure drop and solid holdup</text><text x="80" y="260" font-size="64" fill="#183248" font-weight="500" text-anchor="start">ε<tspan baseline-shift="sub" font-size="65%">s</tspan></text><text x="195" y="260" font-size="66" fill="#183248" font-weight="500" text-anchor="start">≈</text><path d="M 79 191 H 119" stroke="#183248" stroke-width="3"/><path d="M 315 258 H 920" stroke="#183248" stroke-width="3"/><text x="617.5" y="225" font-size="68" fill="#156BC0" font-weight="500" text-anchor="middle">ΔP</text><text x="617.5" y="339" font-size="62" fill="#183248" font-weight="500" text-anchor="middle">g (ρ<tspan baseline-shift="sub" font-size="65%">s</tspan> − ρ<tspan baseline-shift="sub" font-size="65%">g</tspan>) ΔL</text><text x="50" y="432" font-size="27" fill="#4E6578" font-weight="400" text-anchor="start">Interval-averaged solid holdup from a pressure difference</text><text x="50" y="479" font-size="25" fill="#4E6578" font-weight="400" text-anchor="start">Approximation: small friction and acceleration contributions.</text></g></svg>