<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1190" viewBox="0 0 900 1190" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#54718c"/></marker></defs><rect width="900" height="1190" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="60" y="67" font-size="37" fill="#183e60" font-weight="700" text-anchor="start">A PINN training workflow</text><text x="60" y="110" font-size="26" fill="#60778b" font-weight="400" text-anchor="start">Illustrative solution model for one specified problem</text><rect x="60" y="150" width="780" height="104" rx="20" fill="#eff5fb" stroke="#c8d9e9" stroke-width="2"/><text x="450" y="191" font-size="25" fill="#2764a0" font-weight="700" text-anchor="middle">COORDINATES</text><text x="450" y="232" font-size="34" fill="#203447" font-weight="400" text-anchor="middle">x, t</text><path d="M450 254 L450 297" fill="none" stroke="#54718c" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="310" width="780" height="121" rx="20" fill="#183e60" stroke="#183e60" stroke-width="2"/><text x="450" y="355" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">NEURAL NETWORK</text><text x="450" y="400" font-size="32" fill="#e7f3fc" font-weight="400" text-anchor="middle">Predicted field uθ(x, t)</text><path d="M450 431 L450 474" fill="none" stroke="#54718c" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="488" width="780" height="174" rx="20" fill="#edf8f4" stroke="#bbddd1" stroke-width="2"/><text x="95" y="535" font-size="26" fill="#1d7560" font-weight="700" text-anchor="start">AUTOMATIC DIFFERENTIATION</text><text x="95" y="582" font-size="34" fill="#203447" font-weight="400" text-anchor="start">∂uθ/∂t    and    ∂²uθ/∂x²</text><text x="95" y="628" font-size="29" fill="#506778" font-weight="400" text-anchor="start">Form the equation residual rθ</text><path d="M450 662 L450 704" fill="none" stroke="#54718c" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="718" width="780" height="210" rx="20" fill="#eff5fb" stroke="#c8d9e9" stroke-width="2"/><text x="95" y="765" font-size="26" fill="#2764a0" font-weight="700" text-anchor="start">WEIGHTED LOSSES</text><text x="95" y="812" font-size="30" fill="#203447" font-weight="400" text-anchor="start">Data (if available) · PDE residual</text><text x="95" y="858" font-size="30" fill="#203447" font-weight="400" text-anchor="start">Boundary conditions · Initial condition</text><text x="95" y="899" font-size="26" fill="#506778" font-weight="400" text-anchor="start">Sample each term at appropriate points</text><path d="M450 928 L450 970" fill="none" stroke="#54718c" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="984" width="780" height="112" rx="20" fill="#fff7e8" stroke="#ebd3a0" stroke-width="2"/><text x="450" y="1033" font-size="27" fill="#8a6216" font-weight="700" text-anchor="middle">UPDATE NETWORK PARAMETERS</text><text x="450" y="1073" font-size="26" fill="#655b43" font-weight="400" text-anchor="middle">Repeat training, then validate independently</text><text x="60" y="1152" font-size="24" fill="#60778b" font-weight="400" text-anchor="start">Conceptual training loop; no performance claim.</text></g></svg>