<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#54718c"/></marker></defs><rect width="900" height="465" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="45" y="65" font-size="36" fill="#183e60" font-weight="700" text-anchor="start">Heat-equation residual</text><text x="45" y="110" font-size="26" fill="#60778b" font-weight="400" text-anchor="start">Source-free diffusion · Constant α</text><rect x="45" y="148" width="810" height="176" rx="20" fill="#eff5fb" stroke="#c8d9e9" stroke-width="2"/><text x="450" y="225" font-size="54" fill="#203447" font-weight="400" text-anchor="middle">rθ = ∂uθ/∂t − α ∂²uθ/∂x²</text><text x="450" y="290" font-size="28" fill="#506778" font-weight="400" text-anchor="middle">Evaluate at sampled interior points.</text><text x="45" y="380" font-size="28" fill="#506778" font-weight="400" text-anchor="start">uθ: predicted field</text><text x="45" y="423" font-size="28" fill="#506778" font-weight="400" text-anchor="start">α: dimensionless diffusion coefficient</text></g></svg>