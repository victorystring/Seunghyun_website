<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1360" viewBox="0 0 900 1360" role="img" aria-labelledby="title desc"><title id="title">Potential-based arc model workflow</title><desc id="desc">Material data and boundaries feed a potential solve. Electric and magnetic fields supply heating and forces, and temperature and velocity are updated iteratively.</desc><defs><marker id="a142B42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#142B42"/></marker><marker id="a4C6277" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6277"/></marker><marker id="a1466C8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1466C8"/></marker><marker id="aB63465" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B63465"/></marker><marker id="aAB570B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AB570B"/></marker><marker id="a087F7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F7A"/></marker><marker id="aD3E0EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D3E0EB"/></marker></defs><rect width="900" height="1360" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><text x="100" y="60" font-size="39" fill="#142B42" font-weight="700" text-anchor="start">A potential-based</text><text x="100" y="110" font-size="39" fill="#142B42" font-weight="700" text-anchor="start">arc solution workflow</text><text x="100" y="157" font-size="28" fill="#4C6277" font-weight="400" text-anchor="start">One iteration of a coupled model</text><rect x="100" y="210" width="760" height="185" rx="20" fill="#F5F8FB" stroke="#4C6277" stroke-width="2"/><text x="135" y="268" font-size="33" fill="#4C6277" font-weight="700" text-anchor="start">1   Material data and boundaries</text><text x="135" y="319" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">Conductivity σ(T), velocity u,</text><text x="135" y="361" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">electrode current or voltage</text><path d="M 480 408 V 454" fill="none" stroke="#4C6277" stroke-width="4"  marker-end="url(#a4C6277)"/><rect x="100" y="470" width="760" height="185" rx="20" fill="#EFF6FF" stroke="#1466C8" stroke-width="2"/><text x="135" y="528" font-size="33" fill="#1466C8" font-weight="700" text-anchor="start">2   Solve for electric potential φ</text><text x="135" y="579" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">Enforce current continuity with</text><text x="135" y="621" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">the selected MHD approximation</text><path d="M 480 668 V 714" fill="none" stroke="#4C6277" stroke-width="4"  marker-end="url(#a4C6277)"/><rect x="100" y="730" width="760" height="185" rx="20" fill="#EFF6FF" stroke="#1466C8" stroke-width="2"/><text x="135" y="788" font-size="33" fill="#1466C8" font-weight="700" text-anchor="start">3   Recover electromagnetic fields</text><text x="135" y="839" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">Obtain E and J; calculate a compatible</text><text x="135" y="881" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">magnetic field B</text><path d="M 480 928 V 974" fill="none" stroke="#4C6277" stroke-width="4"  marker-end="url(#a4C6277)"/><rect x="100" y="990" width="760" height="185" rx="20" fill="#ECF9F7" stroke="#087F7A" stroke-width="2"/><text x="135" y="1048" font-size="33" fill="#087F7A" font-weight="700" text-anchor="start">4   Update temperature and flow</text><text x="135" y="1099" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">Apply Joule heating q<tspan baseline-shift="sub" font-size="65%">J</tspan> and</text><text x="135" y="1141" font-size="29" fill="#4C6277" font-weight="400" text-anchor="start">Lorentz force J × B</text><path d="M 480 1188 V 1220 H 55 V 300 H 85" fill="none" stroke="#087F7A" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a087F7A)"/><text x="30" y="940" font-size="27" fill="#087F7A" transform="rotate(-90 30 940)">Update σ(T) and u; repeat until consistent</text><text x="100" y="1280" font-size="26" fill="#4C6277" font-weight="400" text-anchor="start">Induction electric fields are neglected here.</text><text x="100" y="1317" font-size="26" fill="#4C6277" font-weight="400" text-anchor="start">Select a formulation for the timescales of interest.</text></g></svg>