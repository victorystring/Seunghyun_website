<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 900 1260" role="img" aria-labelledby="title desc"><title id="title">Magnetic pinch in a straight arc</title><desc id="desc">A cross section with current coming out of the page, counterclockwise magnetic field arrows, and inward magnetic force arrows. Joule heating is identified separately.</desc><defs><marker id="a142B42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#142B42"/></marker><marker id="a4C6277" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6277"/></marker><marker id="a1466C8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1466C8"/></marker><marker id="aB63465" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B63465"/></marker><marker id="aAB570B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AB570B"/></marker><marker id="a087F7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F7A"/></marker><marker id="aD3E0EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D3E0EB"/></marker></defs><rect width="900" height="1260" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><text x="45" y="65" font-size="42" fill="#142B42" font-weight="700" text-anchor="start">How the self-field pinches</text><text x="45" y="117" font-size="42" fill="#142B42" font-weight="700" text-anchor="start">a straight arc</text><text x="45" y="171" font-size="27" fill="#4C6277" font-weight="400" text-anchor="start">Cross section perpendicular to conventional current</text><circle cx="450" cy="505" r="270" fill="#F5F9FD" stroke="#D3E0EB" stroke-width="2"/><circle cx="450" cy="505" r="205" fill="#FFF0DF" stroke="#E8C99E" stroke-width="2"/><path d="M 685 505 A 235 235 0 0 0 498.8592473421735 275.1353138275557" fill="none" stroke="#1466C8" stroke-width="5"  marker-end="url(#a1466C8)"/><path d="M 450 270 A 235 235 0 0 0 220.13531382755565 456.14075265782657" fill="none" stroke="#1466C8" stroke-width="5"  marker-end="url(#a1466C8)"/><path d="M 215 504.99999999999994 A 235 235 0 0 0 401.14075265782645 734.8646861724443" fill="none" stroke="#1466C8" stroke-width="5"  marker-end="url(#a1466C8)"/><path d="M 449.99999999999994 740 A 235 235 0 0 0 679.8646861724443 553.8592473421736" fill="none" stroke="#1466C8" stroke-width="5"  marker-end="url(#a1466C8)"/><path d="M 638 505 L 565 505" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 582.936074863071 372.0639251369291 L 531.3172798364529 423.68272016354706" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 450 317 L 450 390" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 317.0639251369291 372.063925136929 L 368.68272016354706 423.68272016354706" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 262 505 L 335 505" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 317.063925136929 637.9360748630709 L 368.682720163547 586.3172798364529" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 449.99999999999994 693 L 450 620" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><path d="M 582.9360748630709 637.936074863071 L 531.3172798364529 586.3172798364529" fill="none" stroke="#B63465" stroke-width="5"  marker-end="url(#aB63465)"/><circle cx="450" cy="505" r="44" fill="#FFFFFF" stroke="#142B42" stroke-width="5"/><circle cx="450" cy="505" r="11" fill="#142B42"/><text x="450" y="583" font-size="34" fill="#142B42" font-weight="700" text-anchor="middle">J</text><text x="450" y="828" font-size="30" fill="#142B42" font-weight="600" text-anchor="middle">⊙ Current points toward the viewer</text><text x="80" y="914" font-size="31" fill="#142B42" font-weight="600" text-anchor="start">Current J flows along the arc axis.</text><text x="80" y="974" font-size="31" fill="#1466C8" font-weight="600" text-anchor="start">Magnetic field B circles the current channel.</text><text x="80" y="1034" font-size="31" fill="#B63465" font-weight="600" text-anchor="start">Magnetic force J × B acts radially inward.</text><rect x="60" y="1080" width="780" height="100" rx="20" fill="#FFF5E9" stroke="#E7C49C" stroke-width="2"/><text x="85" y="1120" font-size="26" fill="#AB570B" font-weight="600" text-anchor="start">Joule heating is a separate effect:</text><text x="85" y="1160" font-size="34" fill="#AB570B" font-weight="700" text-anchor="start">q<tspan baseline-shift="sub" font-size="65%">J</tspan> = |J|² / σ</text><text x="45" y="1230" font-size="23" fill="#4C6277" font-weight="400" text-anchor="start">Idealized straight arc • Illustrative geometry, no numerical data</text></g></svg>