<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc"><title id="title">Coupled physics in an arc</title><desc id="desc">Pairwise connections between electromagnetics, heat transfer, and fluid motion. Current supplies Joule heating, magnetic fields supply force, and temperature and velocity feed back.</desc><defs><marker id="a142B42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#142B42"/></marker><marker id="a4C6277" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6277"/></marker><marker id="a1466C8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1466C8"/></marker><marker id="aB63465" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B63465"/></marker><marker id="aAB570B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AB570B"/></marker><marker id="a087F7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F7A"/></marker><marker id="aD3E0EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D3E0EB"/></marker></defs><rect width="900" height="1120" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="65" font-size="41" fill="#142B42" font-weight="700" text-anchor="start">The arc is a coupled</text><text x="35" y="117" font-size="41" fill="#142B42" font-weight="700" text-anchor="start">physical system</text><text x="35" y="168" font-size="28" fill="#4C6277" font-weight="400" text-anchor="start">Each model changes the inputs to the others.</text><rect x="20" y="235" width="280" height="160" rx="20" fill="#EFF6FF" stroke="#1466C8" stroke-width="2"/><rect x="600" y="235" width="280" height="160" rx="20" fill="#FFF5E9" stroke="#AB570B" stroke-width="2"/><text x="160" y="297" font-size="27" fill="#1466C8" font-weight="700" text-anchor="middle">Electromagnetics</text><text x="160" y="347" font-size="25" fill="#4C6277" font-weight="400" text-anchor="middle">Electric current • J</text><text x="740" y="297" font-size="27" fill="#AB570B" font-weight="700" text-anchor="middle">Heat transfer</text><text x="740" y="347" font-size="25" fill="#4C6277" font-weight="400" text-anchor="middle">Temperature • T</text><path d="M 330 287 H 570" fill="none" stroke="#1466C8" stroke-width="4"  marker-end="url(#a1466C8)"/><text x="450" y="215" font-size="30" fill="#1466C8" font-weight="600" text-anchor="middle">Joule heating • q<tspan baseline-shift="sub" font-size="65%">J</tspan></text><path d="M 570 347 H 330" fill="none" stroke="#AB570B" stroke-width="4"  marker-end="url(#aAB570B)"/><text x="450" y="439" font-size="30" fill="#AB570B" font-weight="600" text-anchor="middle">Electrical conductivity • σ(T)</text><rect x="20" y="525" width="280" height="160" rx="20" fill="#EFF6FF" stroke="#1466C8" stroke-width="2"/><rect x="600" y="525" width="280" height="160" rx="20" fill="#ECF9F7" stroke="#087F7A" stroke-width="2"/><text x="160" y="587" font-size="27" fill="#1466C8" font-weight="700" text-anchor="middle">Electromagnetics</text><text x="160" y="637" font-size="25" fill="#4C6277" font-weight="400" text-anchor="middle">Magnetic field • B</text><text x="740" y="587" font-size="27" fill="#087F7A" font-weight="700" text-anchor="middle">Fluid motion</text><text x="740" y="637" font-size="25" fill="#4C6277" font-weight="400" text-anchor="middle">Velocity • u</text><path d="M 330 577 H 570" fill="none" stroke="#1466C8" stroke-width="4"  marker-end="url(#a1466C8)"/><text x="450" y="505" font-size="30" fill="#1466C8" font-weight="600" text-anchor="middle">Lorentz force • J × B</text><path d="M 570 637 H 330" fill="none" stroke="#087F7A" stroke-width="4"  marker-end="url(#a087F7A)"/><text x="450" y="729" font-size="30" fill="#087F7A" font-weight="600" text-anchor="middle">Motional effect • u × B</text><rect x="20" y="815" width="280" height="160" rx="20" fill="#FFF5E9" stroke="#AB570B" stroke-width="2"/><rect x="600" y="815" width="280" height="160" rx="20" fill="#ECF9F7" stroke="#087F7A" stroke-width="2"/><text x="160" y="877" font-size="27" fill="#AB570B" font-weight="700" text-anchor="middle">Heat transfer</text><text x="160" y="927" font-size="25" fill="#4C6277" font-weight="400" text-anchor="middle">Temperature • T</text><text x="740" y="877" font-size="27" fill="#087F7A" font-weight="700" text-anchor="middle">Fluid motion</text><text x="740" y="927" font-size="25" fill="#4C6277" font-weight="400" text-anchor="middle">Velocity • u</text><path d="M 330 867 H 570" fill="none" stroke="#AB570B" stroke-width="4"  marker-end="url(#aAB570B)"/><text x="450" y="795" font-size="30" fill="#AB570B" font-weight="600" text-anchor="middle">Density and viscosity</text><path d="M 570 927 H 330" fill="none" stroke="#087F7A" stroke-width="4"  marker-end="url(#a087F7A)"/><text x="450" y="1019" font-size="30" fill="#087F7A" font-weight="600" text-anchor="middle">Convective heat transport</text><text x="35" y="1080" font-size="25" fill="#4C6277" font-weight="400" text-anchor="start">Conceptual coupling map • Redrawn lecture concepts</text></g></svg>