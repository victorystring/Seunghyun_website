<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Electrical response, magnetic force, and heating</title><desc id="desc">Equation card corresponding to the article mathematical expression.</desc><defs><marker id="a142B42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#142B42"/></marker><marker id="a4C6277" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6277"/></marker><marker id="a1466C8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1466C8"/></marker><marker id="aB63465" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B63465"/></marker><marker id="aAB570B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AB570B"/></marker><marker id="a087F7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F7A"/></marker><marker id="aD3E0EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D3E0EB"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><text x="60" y="57" font-size="29" fill="#4C6277" font-weight="600" text-anchor="start">Electrical response, magnetic force, and heating</text><text x="70" y="155" font-size="55" fill="#1466C8" font-weight="600" text-anchor="start">J = σ (E + u × B)</text><text x="70" y="255" font-size="55" fill="#B63465" font-weight="600" text-anchor="start">f<tspan baseline-shift="sub" font-size="65%">L</tspan> = J × B</text><text x="70" y="355" font-size="55" fill="#AB570B" font-weight="600" text-anchor="start">q<tspan baseline-shift="sub" font-size="65%">J</tspan> = J · (E + u × B) = |J|² / σ</text><text x="60" y="477" font-size="22" fill="#4C6277" font-weight="400" text-anchor="start">J, E, u, B, and f<tspan baseline-shift="sub" font-size="65%">L</tspan> are vectors. Force: N/m³. Joule heating: W/m³.</text></g></svg>